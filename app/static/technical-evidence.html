<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagram extraction · Docling</title><link rel="stylesheet" href="/assets/styles.css?v=5.0.5"></head>
<body><a class="skip-link" href="#main-content">Skip to main content</a><main id="main-content" style="max-width:1200px;margin:auto;padding:24px"><a href="/artifact-audit">← Artifact audit</a><h1>Diagram extraction</h1><p>Read nodes, labels and connections from the original image using your selected vision provider. Results remain candidates until you check the pixels. Extraction does not apply book corrections.</p><label>Manual <select id="book"></select></label> <button id="load">Load candidates</button><p id="status" role="status"></p><label>Source item <select id="entry"></select></label> <label>Picture <select id="picture"></select></label><label><input type="checkbox" id="fresh"> Re-extract with a fresh model request</label><button id="extract">Extract with selected vision worker</button>
<section id="review" hidden><div style="position:relative;max-width:100%"><img id="source" style="display:block;width:100%" alt="Original Docling picture"><svg id="boxes" viewBox="0 0 1000 1000" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></svg></div><h2>Extracted nodes and connections</h2><label>Graph JSON (editable)<textarea id="graph" rows="18" style="width:100%"></textarea></label><button id="edit">Save edited graph for review</button><p id="requirements"></p><label>Reviewer name <input id="actor" maxlength="100"></label><label><input type="checkbox" id="checked"> I checked all labels, boxes, arrow directions and branch labels against the original image.</label><button id="validate">Validate reviewed graph</button></section></main><script src="/assets/technical-evidence.js?v=5.0.5"></script></body></html>

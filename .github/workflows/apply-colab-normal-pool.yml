name: Apply Colab normal worker pool

on:
  push:
    branches:
      - fix/colab-normal-worker-pool
    paths:
      - .github/workflows/apply-colab-normal-pool.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Apply scheduler migration
        run: python tools/_apply_colab_normal_pool.py
      - name: Compile and run scheduler regressions
        run: |
          python -m py_compile app/stage2b.py app/stage2b_store.py app/worker_registry.py app/colab_runner.py
          PYTHONPATH=. pytest -q tests/test_colab_normal_pool.py tests/test_stage2b.py tests/test_stage2b_circuit_breaker.py tests/test_colab_runner.py tests/test_worker_registry_review_workers.py tests/test_artifact_sweep.py tests/test_release_version_sync.py
      - name: Commit validated scheduler fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-colab-normal-pool.yml tools/_apply_colab_normal_pool.py
          git add app/stage2b.py app/version.py app/static
          git commit -m "Use every ready Colab for normal Stage2B work"
          git push origin HEAD:fix/colab-normal-worker-pool

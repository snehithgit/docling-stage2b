name: Apply Colab normal worker pool

on:
  push:
    branches: [fix/colab-normal-worker-pool]
    paths: [.github/workflows/apply-colab-normal-pool.yml]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Apply normal Colab pool scheduler
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one anchor in {path}, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          p = Path("app/stage2b.py")

          replace_once(
              p,
              '        self._colab_artifact_tasks: dict[str, asyncio.Task[Any]] = {}\n',
              '        self._colab_normal_tasks: dict[str, asyncio.Task[Any]] = {}\n'
              '        self._colab_artifact_tasks: dict[str, asyncio.Task[Any]] = {}\n',
          )

          replace_once(
              p,
              '            asyncio.create_task(self._device_loop("oneplus"), name="stage2b-oneplus-worker"),\n'
              '            asyncio.create_task(self._colab_artifact_dispatch_loop(), name="stage2b-colab-artifact-dispatcher"),\n',
              '            asyncio.create_task(self._device_loop("oneplus"), name="stage2b-oneplus-worker"),\n'
              '            asyncio.create_task(self._colab_normal_dispatch_loop(), name="stage2b-colab-normal-dispatcher"),\n'
              '            asyncio.create_task(self._colab_artifact_dispatch_loop(), name="stage2b-colab-artifact-dispatcher"),\n',
          )

          replace_once(
              p,
              '        self._tasks.clear()\n'
              '        for task in self._colab_artifact_tasks.values():\n',
              '        self._tasks.clear()\n'
              '        for task in self._colab_normal_tasks.values():\n'
              '            task.cancel()\n'
              '        if self._colab_normal_tasks:\n'
              '            await asyncio.gather(*self._colab_normal_tasks.values(), return_exceptions=True)\n'
              '        self._colab_normal_tasks.clear()\n'
              '        for task in self._colab_artifact_tasks.values():\n',
          )

          replace_once(
              p,
              '''                if selected_provider == "colab":\n                    normal_provider = await self._select_colab_provider()\n                    if not normal_provider:\n                        normal_role_available = False\n                        self.worker_state[target]["provider_wait"] = "No enabled/healthy Colab worker is available"\n                    else:\n                        self.worker_state[target]["provider_wait"] = None\n                else:\n                    self.worker_state[target]["provider_wait"] = None\n''',
              '''                if selected_provider == "colab":\n                    # Dynamic Colab workers have their own normal-work consumers.\n                    # Keeping this logical role loop as a second Colab consumer\n                    # would serialize the pool again and race the per-worker lanes.\n                    normal_role_available = False\n                    normal_provider = None\n                    self.worker_state[target]["provider_wait"] = None\n                else:\n                    self.worker_state[target]["provider_wait"] = None\n''',
          )

          pool_methods = r'''
    async def _claim_colab_normal_job(
        self,
        provider: str,
        targets: list[str],
        next_role_index: int = 0,
    ) -> tuple[str, dict[str, Any], int] | None:
        """Atomically claim one normal Text/Vision row for a physical Colab worker.

        ``next_runnable`` chooses the highest-priority row, while
        ``mark_processing`` is the compare-and-set claim. Multiple physical
        Colabs may observe the same pending head row; only one can flip it to
        processing. A loser immediately retries instead of sleeping for another
        scheduler poll, so an idle second Colab fills quickly.
        """
        if not targets:
            return None
        count = len(targets)
        start = int(next_role_index) % count
        for offset in range(count):
            index = (start + offset) % count
            target = targets[index]
            auto_run = self._auto_run(target)
            run_mode = "auto" if auto_run else "manual"
            # A few immediate retries cover simultaneous claims by the other
            # Colab lanes without turning a transient race into a 2s idle gap.
            for _ in range(4):
                job = await self._store.next_runnable(target, auto_run)
                if job is None:
                    break
                if not await self._store.mark_processing(
                    int(job["id"]), run_mode, str(provider)
                ):
                    continue
                claimed = dict(job)
                claimed["status"] = "processing"
                claimed["run_mode"] = run_mode
                claimed["attempt_count"] = int(claimed.get("attempt_count") or 0) + 1
                claimed["claimed_by"] = str(provider)
                claimed["_dispatch_provider"] = str(provider)
                claimed["_preclaimed_processing"] = True
                return target, claimed, (index + 1) % count
        return None

    async def _colab_normal_dispatch_loop(self) -> None:
        """Maintain one normal Stage-2B consumer per configured Colab worker."""
        while not self._stopping.is_set():
            try:
                config = self._config_getter()
                globally_stopped = self._paused("pi5") and self._paused("oneplus")
                wanted = set() if globally_stopped else set(self._configured_colab_providers())
                for provider in list(self._colab_normal_tasks):
                    task = self._colab_normal_tasks[provider]
                    if task.done() or provider not in wanted:
                        if not task.done():
                            task.cancel()
                        self._colab_normal_tasks.pop(provider, None)
                for provider in sorted(wanted):
                    task = self._colab_normal_tasks.get(provider)
                    if task is None or task.done():
                        self._colab_normal_tasks[provider] = asyncio.create_task(
                            self._colab_normal_worker_loop(provider),
                            name=f"stage2b-{provider.replace(':', '-')}-normal-worker",
                        )
                await asyncio.sleep(config.stage2b_poll_interval_seconds)
            except asyncio.CancelledError:
                raise
            except Exception:
                logger.exception("Stage 2B Colab normal dispatcher failed")
                await asyncio.sleep(self._config_getter().stage2b_poll_interval_seconds)

    async def _colab_normal_worker_loop(self, provider: str) -> None:
        """Drain normal Text/Vision work independently on one physical Colab."""
        self._ensure_provider_state(provider)
        next_role_index = 0
        while not self._stopping.is_set():
            try:
                config = self._config_getter()
                if self._physical_worker_paused(provider):
                    await asyncio.sleep(config.stage2b_poll_interval_seconds)
                    continue

                targets = [
                    target for target in ("pi5", "oneplus")
                    if not self._paused(target) and self._selected_provider(target) == "colab"
                ]
                if not targets:
                    await asyncio.sleep(config.stage2b_poll_interval_seconds)
                    continue
                if not await self._endpoint_provider_ready(provider):
                    await asyncio.sleep(config.stage2b_poll_interval_seconds)
                    continue

                owner = f"{provider}:normal"
                if not await self._reserve_provider(provider, owner):
                    await asyncio.sleep(config.stage2b_poll_interval_seconds)
                    continue
                self.worker_state[provider]["dispatch_provider"] = provider
                claimed = None
                try:
                    claimed = await self._claim_colab_normal_job(
                        provider, targets, next_role_index
                    )
                    if claimed is not None:
                        target, job, next_role_index = claimed
                        await self._run_job(
                            target,
                            job,
                            preclaimed=True,
                            run_mode_override=str(job.get("run_mode") or "manual"),
                            state_key=provider,
                        )
                finally:
                    if provider in self.worker_state:
                        self.worker_state[provider]["dispatch_provider"] = None
                    await self._release_provider(provider, owner)

                # A completed job means this physical worker is already known
                # healthy and hot: immediately pull another row. Sleep only when
                # there was no normal work for this Colab to claim.
                if claimed is not None:
                    continue
                await asyncio.sleep(config.stage2b_poll_interval_seconds)
            except asyncio.CancelledError:
                raise
            except Exception:
                logger.exception("Stage 2B Colab normal worker %s failed", provider)
                self._events.notify("stage2b_colab_worker_error")
                await asyncio.sleep(self._config_getter().stage2b_poll_interval_seconds)

'''
          marker = '    async def _colab_artifact_dispatch_loop(self) -> None:\n'
          text = p.read_text(encoding="utf-8")
          if text.count(marker) != 1:
              raise SystemExit("Could not locate Colab artifact dispatcher insertion point")
          p.write_text(text.replace(marker, pool_methods + marker, 1), encoding="utf-8")

          replace_once(
              p,
              '''                    if target == "pi5" and not is_picture_route:\n                        job["_active_stage"] = "pi5_text"\n                        self.worker_state[state_key]["active_stage"] = "text check"\n                        request, result, verdict, model, endpoint = await self._run_pi5(job)\n''',
              '''                    if target == "pi5" and not is_picture_route:\n                        job["_active_stage"] = "pi5_text"\n                        self.worker_state[state_key]["active_stage"] = "text check"\n                        if state_key == "pi5":\n                            # Preserve the historical one-argument call shape for\n                            # the normal local Text lane and existing wrappers.\n                            request, result, verdict, model, endpoint = await self._run_pi5(job)\n                        else:\n                            request, result, verdict, model, endpoint = await self._run_pi5(\n                                job, role_target=state_key\n                            )\n''',
          )

          replace_once(
              p,
              '    async def _run_pi5(self, job: dict[str, Any]):\n',
              '    async def _run_pi5(self, job: dict[str, Any], role_target: str = "pi5"):\n',
          )
          replace_once(
              p,
              '            progress = self._prepare_oneplus_stream_region("text target reconstruction", target="pi5")\n',
              '            progress = self._prepare_oneplus_stream_region("text target reconstruction", target=role_target)\n',
          )

          test_path = Path("tests/test_colab_normal_pool.py")
          test_path.write_text(r'''import asyncio
import tempfile
from pathlib import Path
from types import SimpleNamespace

import pytest

from app.config import AppConfig
from app.stage2b import Stage2BWorker
from app.stage2b_store import Stage2BStore


def route(route_id: str):
    return {
        "route_id": route_id,
        "target": "pi5",
        "code": "OCR_GARBLE",
        "priority": "medium",
        "source": {"type": "text", "index": int(route_id[-1]), "page": 1},
        "action": "verify",
        "reason": "pool test",
    }


def events():
    return SimpleNamespace(notify=lambda *_args, **_kwargs: None)


@pytest.mark.asyncio
async def test_two_colabs_can_preclaim_distinct_rows_from_same_text_queue():
    with tempfile.TemporaryDirectory() as directory:
        root = Path(directory)
        store = Stage2BStore(str(root / "jobs.db"))
        await store.initialize()
        await store.sync_routes(
            1, 1, "g1", [route("R1"), route("R2")], "book__job1", "book.zip"
        )
        await store.start_manual_batch("pi5")
        cfg = AppConfig(
            database_path=str(root / "jobs.db"),
            processed_dir=str(root / "processed"),
            text_verifier_provider="colab",
            stage2b_pi5_auto_run=False,
            stage2b_oneplus_auto_run=False,
        )
        worker = Stage2BWorker(lambda: cfg, store, SimpleNamespace(), events())

        first = await worker._claim_colab_normal_job("colab:colab-1", ["pi5"], 0)
        second = await worker._claim_colab_normal_job("colab:colab-2", ["pi5"], 0)

        assert first is not None and second is not None
        assert first[1]["id"] != second[1]["id"]
        assert first[1]["_preclaimed_processing"] is True
        assert second[1]["_preclaimed_processing"] is True
        rows = await store.list_jobs(limit=10, current_only=True)
        assert {row["status"] for row in rows} == {"processing"}
        assert {row["claimed_by"] for row in rows} == {
            "colab:colab-1", "colab:colab-2"
        }


@pytest.mark.asyncio
async def test_two_physical_colab_loops_start_same_text_backlog_concurrently():
    with tempfile.TemporaryDirectory() as directory:
        root = Path(directory)
        store = Stage2BStore(str(root / "jobs.db"))
        await store.initialize()
        await store.sync_routes(
            1, 1, "g1", [route("R1"), route("R2")], "book__job1", "book.zip"
        )
        await store.start_manual_batch("pi5")
        cfg = AppConfig(
            database_path=str(root / "jobs.db"),
            processed_dir=str(root / "processed"),
            text_verifier_provider="colab",
            vision_verifier_provider="oneplus",
            stage2b_poll_interval_seconds=1,
            stage2b_pi5_auto_run=False,
            stage2b_oneplus_auto_run=False,
        )
        worker = Stage2BWorker(lambda: cfg, store, SimpleNamespace(), events())

        async def ready(_provider):
            return True

        worker._physical_worker_paused = lambda _provider: False
        worker._endpoint_provider_ready = ready

        started = []
        both_started = asyncio.Event()
        release = asyncio.Event()

        async def fake_run_job(target, job, **kwargs):
            started.append((target, kwargs.get("state_key"), int(job["id"])))
            if len(started) >= 2:
                both_started.set()
            await release.wait()

        worker._run_job = fake_run_job
        task1 = asyncio.create_task(worker._colab_normal_worker_loop("colab:colab-1"))
        task2 = asyncio.create_task(worker._colab_normal_worker_loop("colab:colab-2"))
        try:
            await asyncio.wait_for(both_started.wait(), timeout=2.0)
            assert {row[1] for row in started} == {"colab:colab-1", "colab:colab-2"}
            assert len({row[2] for row in started}) == 2
        finally:
            release.set()
            worker._stopping.set()
            await asyncio.gather(task1, task2, return_exceptions=True)


@pytest.mark.asyncio
async def test_colab_pool_round_robins_text_and_vision_when_both_use_colab():
    class FakeStore:
        def __init__(self):
            self.rows = {
                "pi5": [{"id": 1, "attempt_count": 0}],
                "oneplus": [{"id": 2, "attempt_count": 0}],
            }

        async def next_runnable(self, target, _auto_run):
            rows = self.rows[target]
            return dict(rows[0]) if rows else None

        async def mark_processing(self, job_id, _run_mode, _claimed_by):
            for rows in self.rows.values():
                if rows and rows[0]["id"] == job_id:
                    rows.pop(0)
                    return True
            return False

    cfg = AppConfig(
        text_verifier_provider="colab",
        vision_verifier_provider="colab",
        stage2b_pi5_auto_run=False,
        stage2b_oneplus_auto_run=False,
    )
    worker = Stage2BWorker(lambda: cfg, FakeStore(), SimpleNamespace(), events())
    first = await worker._claim_colab_normal_job("colab:colab-1", ["pi5", "oneplus"], 0)
    second = await worker._claim_colab_normal_job("colab:colab-1", ["pi5", "oneplus"], first[2])
    assert first[0] == "pi5"
    assert second[0] == "oneplus"
''', encoding="utf-8")

          old_version = "2026.10.03.40.11AH12"
          new_version = "2026.10.04.40.11AH13"
          version = Path("app/version.py")
          version_text = version.read_text(encoding="utf-8")
          if old_version not in version_text:
              raise SystemExit(f"Expected current version {old_version}")
          version.write_text(version_text.replace(old_version, new_version), encoding="utf-8")
          nav = Path("app/static/nav.js")
          nav_text = nav.read_text(encoding="utf-8")
          if old_version not in nav_text:
              raise SystemExit("nav.js version marker not found")
          nav.write_text(nav_text.replace(old_version, new_version), encoding="utf-8")
          for html in Path("app/static").glob("*.html"):
              text = html.read_text(encoding="utf-8")
              if f"?v={old_version}" in text:
                  html.write_text(text.replace(f"?v={old_version}", f"?v={new_version}"), encoding="utf-8")
          PY

      - name: Compile and run scheduler regressions
        run: |
          python -m py_compile app/stage2b.py app/stage2b_store.py app/worker_registry.py app/colab_runner.py
          PYTHONPATH=. pytest -q \
            tests/test_colab_normal_pool.py \
            tests/test_stage2b.py \
            tests/test_stage2b_circuit_breaker.py \
            tests/test_colab_runner.py \
            tests/test_worker_registry_review_workers.py \
            tests/test_artifact_sweep.py \
            tests/test_release_version_sync.py

      - name: Commit validated scheduler fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-colab-normal-pool.yml
          git add app/stage2b.py app/version.py app/static tests/test_colab_normal_pool.py
          git commit -m "Use every ready Colab for normal Stage2B work"
          git push origin HEAD:fix/colab-normal-worker-pool

name: Validate source

on:
  push:
    branches-ignore:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio

      - name: Python syntax
        run: python -m compileall -q app tests

      - name: Prepare container-style test paths
        run: |
          sudo mkdir -p /data/db /data/input /data/output /data/converted /data/processed
          sudo chown -R "$USER":"$USER" /data

      - name: Test suite
        run: PYTHONPATH=. pytest -q

      - name: Frontend JavaScript syntax
        run: |
          for file in app/static/*.js; do
            node --check "$file"
          done

      - name: Package validated source
        run: |
          zip -qr marine-pipeline-studio-v2026.09.30.40.11AH5.zip . -x ".git/*" "marine-pipeline-studio-v2026.09.30.40.11AH5.zip"

      - name: Upload validated source
        uses: actions/upload-artifact@v4
        with:
          name: marine-pipeline-studio-v2026.09.30.40.11AH5
          path: marine-pipeline-studio-v2026.09.30.40.11AH5.zip
          if-no-files-found: error

name: AH4 validation

on:
  push:
    branches:
      - release-2026.09.30.40.11AH4
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio
      - name: Prepare container-like data root
        run: |
          sudo mkdir -p /data
          sudo chown -R "$USER":"$USER" /data
      - name: Python compile
        run: python -m compileall -q app tests
      - name: Test suite
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Frontend JavaScript syntax
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(find app/static -maxdepth 1 -type f -name '*.js' | sort)

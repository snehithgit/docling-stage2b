name: Apply retrieval freshness reuse fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-retrieval-freshness-reuse.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Prepare runtime directories
        run: |
          sudo mkdir -p /data/db /data/input /data/output /data/processed
          sudo chown -R "$(id -u):$(id -g)" /data

      - name: Apply freshness migration
        run: |
          python .github/retrieval-freshness-reuse.py
          python -m py_compile app/pipeline_state.py app/hybrid_retrieval.py

      - name: Run retrieval tests
        run: |
          python -m pytest -q tests/test_retrieval.py tests/test_retrieval_scope_safety.py tests/test_hybrid_retrieval.py tests/test_retrieval_freshness_reuse.py

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/retrieval-freshness-reuse.patch
          git rm .github/retrieval-freshness-reuse.py
          git rm .github/workflows/fix-retrieval-freshness-reuse.yml
          git add app/pipeline_state.py app/hybrid_retrieval.py app/static/retrieval.html tests/test_retrieval_freshness_reuse.py
          git commit -m "Reuse embeddings across ranking-only retrieval upgrades"
          git push origin HEAD:main

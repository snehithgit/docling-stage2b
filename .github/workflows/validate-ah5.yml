name: Backend and frontend validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
          sudo mkdir -p /data && sudo chown -R $USER:$USER /data
      - name: Python syntax
        run: python -m compileall -q app
      - name: JavaScript syntax
        run: find app/static -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Frontend behavior regressions
        run: node --test tests/frontend/*.test.cjs
      - name: Test suite
        run: PYTHONPATH=. pytest -q

name: Apply Retrieval v9.2 relevance-first

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-retrieval-v9.2.yml

permissions:
  contents: write

jobs:
  apply-retrieval-v9-2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reassemble and verify v9.2 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/retrieval-v9.2-patch/part-*.b64 | base64 -d | gzip -d > /tmp/retrieval-v9.2.diff
          echo "f086e60fd732a16104d2f6162c32d6444a3c79da13d65dc7497af51af16740d0  /tmp/retrieval-v9.2.diff" | sha256sum -c -
          git apply --check /tmp/retrieval-v9.2.diff

      - name: Apply retrieval v9.2
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/retrieval-v9.2.diff
          grep -q 'RETRIEVAL_RULE_VERSION = "retrieval-relevance-first-v9.2"' app/retrieval.py
          python -m py_compile app/retrieval.py

      - name: Run retrieval regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_retrieval.py tests/test_retrieval_scope_safety.py tests/test_hybrid_retrieval.py

      - name: Commit v9.2 and remove one-shot patch machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .github/retrieval-v9.2-patch
          git rm .github/workflows/apply-retrieval-v9.2.yml
          git add app/retrieval.py
          git commit -m "Upgrade retrieval to relevance-first v9.2"
          git push origin HEAD:main
